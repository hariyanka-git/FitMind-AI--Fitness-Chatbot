<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FitMind AI – Smart Fitness with Music & Streak</title>
    <!-- Google Fonts + Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ---------- exact original styles from given code (unchanged) ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #e0f2fe 0%, #ffe0f0 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .app-container {
            max-width: 1300px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25), 0 2px 8px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .glass-nav {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            background: rgba(255, 248, 250, 0.85);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 182, 193, 0.5);
            backdrop-filter: blur(4px);
            flex-wrap: wrap;
            position: relative;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 0.85rem 1.8rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 3rem;
            cursor: pointer;
            transition: all 0.25s;
            color: #4b5563;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(2px);
        }

        .tab-btn i {
            font-size: 1.2rem;
        }

        .tab-btn.active {
            background: linear-gradient(115deg, #fbcfe8, #f9a8d4);
            color: #2c2c2c;
            box-shadow: 0 6px 14px rgba(249, 168, 212, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .tab-btn:hover:not(.active) {
            background: rgba(255, 228, 241, 0.7);
            transform: translateY(-2px);
            color: #1e293b;
        }

        .logout-btn {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,220,235,0.8);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            gap: 6px;
            align-items: center;
            color: #9b2c5c;
            transition: 0.2s;
        }
        .logout-btn:hover {
            background: #fbcfe8;
        }

        .content-pane {
            padding: 2rem 2rem 2rem 2rem;
            min-height: 550px;
            transition: 0.2s;
        }

        /* chat area */
        .chat-wrapper {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 2rem;
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 65vh;
            max-height: 550px;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            max-width: 80%;
            animation: fadeSlideUp 0.25s ease;
        }

        .message.user {
            align-self: flex-end;
            justify-content: flex-end;
        }

        .message.bot {
            align-self: flex-start;
        }

        .bubble {
            padding: 0.9rem 1.3rem;
            border-radius: 2rem;
            font-size: 0.95rem;
            line-height: 1.4;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .user .bubble {
            background: #fbcfe8;
            color: #2d2a2e;
            border-bottom-right-radius: 0.4rem;
            border: 1px solid #ffdfe8;
        }

        .bot .bubble {
            background: #e0f2fe;
            color: #0c4a6e;
            border-bottom-left-radius: 0.4rem;
            border: 1px solid #cff2ff;
        }

        .chat-input-area {
            display: flex;
            gap: 0.75rem;
            padding: 1rem 1.5rem 1.5rem;
            background: rgba(255, 245, 248, 0.7);
            border-top: 1px solid rgba(255, 182, 193, 0.4);
        }

        .chat-input-area input {
            flex: 1;
            border: none;
            background: white;
            padding: 0.9rem 1.2rem;
            border-radius: 3rem;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            border: 1px solid #ffe2ed;
        }

        .chat-input-area input:focus {
            border-color: #f9a8d4;
            box-shadow: 0 0 0 3px rgba(249,168,212,0.2);
        }

        .chat-input-area button {
            background: #fbcfe8;
            border: none;
            width: 48px;
            border-radius: 3rem;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.2s;
            color: #9b2c5c;
        }

        .chat-input-area button:hover {
            background: #f9a8d4;
            transform: scale(0.96);
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            padding: 0.8rem 1.5rem 1rem;
            background: rgba(255, 250, 245, 0.6);
        }

        .suggestion-chip {
            background: white;
            border-radius: 40px;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #b91c5c;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            border: 1px solid #ffe0ed;
        }

        .suggestion-chip:hover {
            background: #ffe4f0;
            transform: translateY(-2px);
            border-color: #f9a8d4;
        }

        /* workout cards grid */
        .workout-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .workout-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 1.8rem;
            padding: 1.5rem;
            transition: all 0.25s;
            border: 1px solid rgba(255, 192, 203, 0.5);
            box-shadow: 0 10px 20px -8px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        .workout-card:hover {
            transform: translateY(-6px);
            background: white;
            border-color: #fbcfe8;
        }

        .workout-icon {
            font-size: 2.2rem;
            margin-bottom: 1rem;
            color: #ec489a;
        }

        .workout-card h3 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .random-btn {
            background: linear-gradient(120deg, #bfdbfe, #fbcfe8);
            border: none;
            padding: 0.9rem 1.8rem;
            border-radius: 3rem;
            font-weight: 600;
            margin-top: 2rem;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* wellness breathing */
        .wellness-card {
            background: rgba(255, 255, 255, 0.75);
            border-radius: 2rem;
            padding: 1.8rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(8px);
        }

        .breathing-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, #fbcfe8, #bae6fd);
            margin: 1rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.6rem;
            transition: transform 0.3s ease;
            box-shadow: 0 15px 25px -10px rgba(0,0,0,0.2);
            cursor: pointer;
        }

        .breathing-text {
            font-size: 1.3rem;
            font-weight: 600;
            margin-top: 0.5rem;
            color: #2c2c2c;
        }

        .quote-box {
            background: #ffe9f2;
            padding: 1.3rem;
            border-radius: 1.5rem;
            font-style: italic;
            margin-top: 1rem;
        }

        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.8rem;
            color: #6c5b6b;
            background: rgba(255, 248, 250, 0.7);
            border-top: 1px solid rgba(255, 192, 203, 0.4);
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 650px) {
            .content-pane {
                padding: 1.2rem;
            }
            .tab-btn {
                padding: 0.6rem 1.2rem;
                font-size: 0.9rem;
            }
            .message {
                max-width: 95%;
            }
            .bubble {
                font-size: 0.85rem;
            }
        }

        /* dashboard & streak */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .track-card {
            background: rgba(255,255,240,0.7);
            border-radius: 1.8rem;
            padding: 1.2rem;
            backdrop-filter: blur(4px);
            margin-bottom: 0;
            border: 1px solid #ffe2ed;
        }
        .progress-bar {
            background: #ffe0ef;
            border-radius: 1rem;
            height: 12px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            background: linear-gradient(90deg, #f9a8d4, #ec489a);
            width: 0%;
            height: 100%;
            border-radius: 1rem;
        }
        .track-control {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 8px;
        }
        .track-control button {
            background: white;
            border: 1px solid #fbcfe8;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        /* auth container */
        .auth-container {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.3);
            padding: 2rem 1.8rem;
            text-align: center;
            border: 1px solid rgba(255,255,240,0.6);
        }
        .auth-container h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ec489a, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .quote-slider {
            background: rgba(255,240,245,0.7);
            border-radius: 2rem;
            padding: 1rem;
            margin: 1.2rem 0;
            font-style: italic;
            font-weight: 500;
            color: #334155;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .input-group {
            margin: 1rem 0;
            text-align: left;
        }
        .input-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            border-radius: 2rem;
            border: 1px solid #ffe2ed;
            background: white;
            outline: none;
            font-size: 1rem;
        }
        .input-group input:focus {
            border-color: #f9a8d4;
            box-shadow: 0 0 0 3px rgba(249,168,212,0.2);
        }
        .auth-btn {
            background: linear-gradient(115deg, #fbcfe8, #f9a8d4);
            border: none;
            width: 100%;
            padding: 0.9rem;
            border-radius: 3rem;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .toggle-auth {
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .toggle-auth span {
            color: #db2777;
            cursor: pointer;
            font-weight: 600;
            text-decoration: underline;
        }
        .error-msg {
            color: #e11d48;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        /* checklist view styles */
        .checklist-container {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 2rem;
            padding: 1.5rem;
            backdrop-filter: blur(4px);
        }
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid #ffe2ed;
        }
        .checklist-item label {
            flex: 1;
            cursor: pointer;
            font-size: 1rem;
            color: #2c2c2c;
        }
        .checklist-item input {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .done-btn {
            background: linear-gradient(115deg, #fbcfe8, #f9a8d4);
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 3rem;
            font-weight: bold;
            margin-top: 1.5rem;
            cursor: pointer;
        }
        .back-btn {
            background: #e2e8f0;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 2rem;
            margin-right: 1rem;
            cursor: pointer;
        }
        .motivation-message {
            background: #d9f99d;
            color: #365314;
            padding: 0.8rem;
            border-radius: 2rem;
            text-align: center;
            margin-bottom: 1rem;
            font-weight: 500;
        }
        /* music card style */
        .music-card {
            background: rgba(255,255,240,0.7);
            border-radius: 1.8rem;
            padding: 1.5rem;
            text-align: center;
            backdrop-filter: blur(8px);
        }
        .music-iframe {
            width: 100%;
            border-radius: 1rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<!-- AUTHENTICATION PAGE -->
<div id="authPage" class="auth-container">
    <h1><i class="fas fa-heartbeat"></i> FitMind AI</h1>
    <div class="quote-slider" id="quoteSlider">💪 “The body achieves what the mind believes.”</div>
    <div id="authForm">
        <div class="input-group">
            <input type="email" id="authEmail" placeholder="Email address" autocomplete="email">
        </div>
        <div class="input-group">
            <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">
        </div>
        <button id="authSubmitBtn" class="auth-btn">Login</button>
        <div class="toggle-auth">New here? <span id="toggleAuthMode">Create account</span></div>
        <div id="authError" class="error-msg"></div>
    </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="app-container" style="display: none;">
    <div class="glass-nav">
        <button class="tab-btn active" data-tab="chat"><i class="fas fa-comment-dots"></i> Chat</button>
        <button class="tab-btn" data-tab="workouts"><i class="fas fa-dumbbell"></i> Workouts</button>
        <button class="tab-btn" data-tab="wellness"><i class="fas fa-spa"></i> Wellness</button>
        <button class="tab-btn" data-tab="dashboard"><i class="fas fa-chart-line"></i> Dashboard</button>
        <button class="tab-btn" data-tab="music"><i class="fas fa-music"></i> Music</button>
        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Exit</button>
    </div>
    <div class="content-pane" id="dynamicContent"></div>
    <footer><i class="fas fa-heart" style="color:#f472b6;"></i> Smart fitness companion — real advice, real motivation</footer>
</div>

<script>
    // ---------- GLOBAL STATE ----------
    let currentUser = null;
    let authMode = "login";
    let activeTab = "chat";
    let breathingInterval = null;
    let breathingActive = false;

    // ---------- FITNESS QUOTES ROTATOR ----------
    const fitnessQuotes = [
        "🏆 “Your only limit is you.” – Unknown",
        "💪 “The pain you feel today will be the strength you feel tomorrow.”",
        "🧘 “Take care of your body. It’s the only place you have to live.” – Jim Rohn",
        "🌟 “Small daily improvements are the key to staggering long-term results.”",
        "🔥 “Don’t wish for it, work for it.”",
        "💙 “Fitness is not about being better than someone else, it’s about being better than you used to be.”"
    ];
    let quoteIndex = 0;
    setInterval(() => {
        const qDiv = document.getElementById("quoteSlider");
        if(qDiv && document.getElementById("authPage").style.display !== "none") {
            quoteIndex = (quoteIndex + 1) % fitnessQuotes.length;
            qDiv.innerHTML = `<i class="fas fa-quote-left" style="margin-right:6px;color:#ec489a;"></i> ${fitnessQuotes[quoteIndex]}`;
        }
    }, 5000);

    // ---------- USER & FITNESS DATA + STREAK SYSTEM ----------
    function getUsers() {
        let users = localStorage.getItem("fitmind_users");
        return users ? JSON.parse(users) : {};
    }
    function saveUsers(users) {
        localStorage.setItem("fitmind_users", JSON.stringify(users));
    }

    // Update streak based on last active date
    function updateStreak(email, todayStr) {
        let allData = localStorage.getItem("fitmind_fitness");
        allData = allData ? JSON.parse(allData) : {};
        if (!allData[email]) {
            allData[email] = { steps: 0, water: 0, workoutMins: 0, lastDate: todayStr, streak: 1 };
        } else {
            let lastDate = allData[email].lastDate || "";
            let currentStreak = allData[email].streak || 0;
            if (lastDate !== todayStr) {
                // check if yesterday
                let yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                let yesterdayStr = yesterday.toDateString();
                if (lastDate === yesterdayStr) {
                    currentStreak++;
                } else {
                    currentStreak = 1;
                }
                allData[email].streak = currentStreak;
                allData[email].lastDate = todayStr;
            }
        }
        localStorage.setItem("fitmind_fitness", JSON.stringify(allData));
        return allData[email].streak || 0;
    }

    function getFitnessData(email) {
        let allData = localStorage.getItem("fitmind_fitness");
        allData = allData ? JSON.parse(allData) : {};
        let today = new Date().toDateString();
        if (!allData[email]) {
            allData[email] = { steps: 0, water: 0, workoutMins: 0, lastDate: today, streak: 1 };
        } else {
            if (allData[email].lastDate !== today) {
                // reset daily values but keep streak updated later
                allData[email].steps = 0;
                allData[email].water = 0;
                allData[email].workoutMins = 0;
                allData[email].lastDate = today;
                // streak will be updated on any activity
            }
        }
        localStorage.setItem("fitmind_fitness", JSON.stringify(allData));
        return allData[email];
    }

    function updateFitnessData(email, updates) {
        let allData = localStorage.getItem("fitmind_fitness");
        allData = allData ? JSON.parse(allData) : {};
        let today = new Date().toDateString();
        if (!allData[email]) {
            allData[email] = { steps: 0, water: 0, workoutMins: 0, lastDate: today, streak: 1 };
        }
        Object.assign(allData[email], updates);
        allData[email].lastDate = today;
        // update streak based on any activity (steps, water, mins)
        let oldStreak = allData[email].streak || 0;
        let lastDate = allData[email].lastDate || "";
        if (lastDate !== today) {
            let yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            let yesterdayStr = yesterday.toDateString();
            if (lastDate === yesterdayStr) {
                allData[email].streak = oldStreak + 1;
            } else {
                allData[email].streak = 1;
            }
            allData[email].lastDate = today;
        } else {
            // already today, ensure streak is at least 1
            if (!allData[email].streak) allData[email].streak = 1;
        }
        localStorage.setItem("fitmind_fitness", JSON.stringify(allData));
        return allData[email];
    }

    // ---------- AUTH LOGIC ----------
    function showAuthError(msg) {
        const errDiv = document.getElementById("authError");
        if (errDiv) errDiv.innerText = msg;
        setTimeout(() => { if(errDiv) errDiv.innerText = ""; }, 2500);
    }
    function handleAuth() {
        const email = document.getElementById("authEmail").value.trim();
        const password = document.getElementById("authPassword").value.trim();
        if (!email || !password) { showAuthError("Please fill both fields."); return; }
        const users = getUsers();
        if (authMode === "login") {
            if (users[email] && users[email] === password) {
                currentUser = email;
                localStorage.setItem("fitmind_currentUser", email);
                showMainApp();
            } else { showAuthError("Invalid email or password."); }
        } else {
            if (users[email]) { showAuthError("Email already exists. Try login."); return; }
            users[email] = password;
            saveUsers(users);
            let today = new Date().toDateString();
            updateFitnessData(email, { steps: 0, water: 0, workoutMins: 0, lastDate: today, streak: 1 });
            currentUser = email;
            localStorage.setItem("fitmind_currentUser", email);
            showMainApp();
        }
    }
    function toggleAuthMode() {
        authMode = authMode === "login" ? "signup" : "login";
        const btn = document.getElementById("authSubmitBtn");
        const toggleSpan = document.getElementById("toggleAuthMode");
        btn.innerText = authMode === "login" ? "Login" : "Sign Up";
        toggleSpan.innerText = authMode === "login" ? "Create account" : "Back to Login";
        document.getElementById("authError").innerText = "";
    }
    function logout() {
        currentUser = null;
        localStorage.removeItem("fitmind_currentUser");
        document.getElementById("mainApp").style.display = "none";
        document.getElementById("authPage").style.display = "block";
        if (breathingInterval) clearInterval(breathingInterval);
        breathingActive = false;
        chatMessages = [
            { text: "👋 Hey there! I'm **FitMind** — your smart fitness buddy! 💙💗 Ask me anything: workouts, nutrition, mindset, or just a motivational boost. Try: *\"quick home workout\"*, *\"protein sources\"*, *\"stress relief\"*", sender: "bot" }
        ];
    }
    function showMainApp() {
        document.getElementById("authPage").style.display = "none";
        document.getElementById("mainApp").style.display = "block";
        switchTab("chat");
        bindTabEvents();
    }

    // ---------- ORIGINAL CHATBOT LOGIC ----------
    let chatMessages = [
        { text: "👋 Hey there! I'm **FitMind** — your smart fitness buddy! 💙💗 Ask me anything: workouts, nutrition, mindset, or just a motivational boost. Try: *\"quick home workout\"*, *\"protein sources\"*, *\"stress relief\"*", sender: "bot" }
    ];

    function getSmartReply(userMsg) {
        const msg = userMsg.toLowerCase().trim();
        if (msg.match(/^(hi|hello|hey|hola|sup)/i)) {
            return "Hey hey! 💪 Ready to crush your fitness goals? Let me know if you need a workout plan, meal ideas, or just some energy!";
        }

    // ---------- WELLNESS & BREATHING ----------
    function stopBreathingTimer() { if(breathingInterval) { clearInterval(breathingInterval); breathingInterval = null; } breathingActive = false; }
    function startBreathingExercise() {
        if(breathingInterval) stopBreathingTimer();
        breathingActive = true;
        const circleElem = document.getElementById("breathingCircle");
        const breatheInstruction = document.getElementById("breatheInstruction");
        if (!circleElem || !breatheInstruction) return;
        let currentPhase = "inhale";
        let countdown = 4;
        const updateBreathing = () => {
            if (!breathingActive) return;
            if (currentPhase === "inhale") {
                breatheInstruction.innerText = `🌬️ Inhale... ${countdown}s`;
                circleElem.style.transform = "scale(1.1)";
                countdown--;
                if (countdown < 0) { currentPhase = "hold"; countdown = 4; }
            } else if (currentPhase === "hold") {
                breatheInstruction.innerText = `🧘 Hold... ${countdown}s`;
                countdown--;
                if (countdown < 0) { currentPhase = "exhale"; countdown = 6; }
            } else {
                breatheInstruction.innerText = `🌊 Exhale... ${countdown}s`;
                circleElem.style.transform = "scale(0.9)";
                countdown--;
                if (countdown < 0) { currentPhase = "inhale"; countdown = 4; }
            }
        };
        updateBreathing();
        breathingInterval = setInterval(updateBreathing, 1000);
    }

    // ---------- TAB SWITCHING ----------
    function switchTab(tabId) {
        activeTab = tabId;
        document.querySelectorAll(".tab-btn").forEach(btn => {
            if(btn.getAttribute("data-tab") === tabId) btn.classList.add("active");
            else btn.classList.remove("active");
        });
        if(tabId !== "wellness") stopBreathingTimer();
        if(tabId === "chat") renderChatTab();
        else if(tabId === "workouts") renderWorkoutsTab();
        else if(tabId === "wellness") renderWellnessTab();
        else if(tabId === "dashboard") renderDashboard();
        else if(tabId === "music") renderMusicTab();
    }

    function bindTabEvents() {
        document.querySelectorAll(".tab-btn").forEach(btn => {
            if(btn.id === "logoutBtn") return;
            btn.removeEventListener("click", handleTabClick);
            btn.addEventListener("click", handleTabClick);
        });
        function handleTabClick(e) { const tab = this.getAttribute("data-tab"); if(tab) switchTab(tab); }
        document.getElementById("logoutBtn")?.addEventListener("click", logout);
    }

            document.getElementById("mainApp").style.display = "none";

        document.getElementById("authSubmitBtn")?.addEventListener("click", handleAuth);
        document.getElementById("toggleAuthMode")?.addEventListener("click", toggleAuthMode);
        const qDiv = document.getElementById("quoteSlider");
        if(qDiv) qDiv.innerHTML = `<i class="fas fa-quote-left" style="margin-right:6px;color:#ec489a;"></i> ${fitnessQuotes[0]}`;
    }
    init();
</script>
</body>
</html>
